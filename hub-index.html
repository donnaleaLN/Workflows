<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>donnaleaLN — Projects</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #EFEAF7; color: #00172E; min-height: 100vh; padding: 48px 16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    header, .grid { max-width: 880px; margin: 0 auto; }
    header { margin-bottom: 28px; }
    h1 { font-size: 28px; margin-bottom: 6px; }
    header p { color: #5b6673; font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { display: block; background: #fff; border: 1px solid #C5CED9; border-radius: 16px; padding: 24px; color: inherit; text-decoration: none; }
    .card:hover, .card:focus-visible { border-color: #00172E; box-shadow: 0 2px 10px rgba(0, 23, 46, 0.12); }
    .card h2 { font-size: 18px; margin-bottom: 6px; }
    .card p { color: #5b6673; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>Projects</h1>
    <p>A collection of things I've built.</p>
  </header>
  <main class="grid">
    <a class="card" href="https://donnalealn.github.io/Workflows/">
      <h2>Workflows</h2>
      <p>Protégé workflows prototype.</p>
    </a>
    <!-- Copy a card block like the one above for each new project. -->
  </main>
</body>
</html>
