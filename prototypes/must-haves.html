<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Energy Disruption Monitor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: Protégé shell — slim icon rail, lavender workspace, white working surfaces; monitor = brief → filters → tabbed views → detail drawer */
:root{
  --bg:#FFFFFF; --bg2:#FFFFFF; --surface:#FFFFFF; --surface2:#F5F7F9; --ink:#00172E; --ink2:#455A64; --muted:#6B7A86;
  --line:rgba(160,172,186,.45); --line2:rgba(197,206,217,.7); --accent:#006EBB; --accent-weak:#E3F0FA; --focus:#006EBB;
  --neg:#B42318; --neg-weak:#FDECEA; --pos:#1D7A46; --pos-weak:#E6F4EC; --neu:#6B7A86; --neu-weak:#EEF1F4;
  --tag:#FFF3C4; --tag-ink:#6B5A00; --interp:#F3F5F7; --interp-line:#B4BEC8; --interp-ink:#455A64;
  --reg:#7A4CC2; --geo:#C2551F; --mkt:#0A7F8C;
  --sans:Lato,"Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(0,23,46,.06),0 4px 16px rgba(0,23,46,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1520; --bg2:#101A26; --surface:#142231; --surface2:#1A2A3B; --ink:#E7EEF6; --ink2:#B5C3D1; --muted:#8C9DAE;
  --line:rgba(140,157,174,.28); --line2:rgba(140,157,174,.4); --accent:#5DB2F0; --accent-weak:#16324A; --focus:#5DB2F0;
  --neg:#F2867C; --neg-weak:#3A1D1C; --pos:#6FD39B; --pos-weak:#15342A; --neu:#9AAABB; --neu-weak:#22303F;
  --tag:#4A4012; --tag-ink:#FFE38A; --interp:#1A2836; --interp-line:#4C5D6E; --interp-ink:#B5C3D1;
  --reg:#B793F0; --geo:#F29A6A; --mkt:#5CCFD9; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1520; --bg2:#101A26; --surface:#142231; --surface2:#1A2A3B; --ink:#E7EEF6; --ink2:#B5C3D1; --muted:#8C9DAE;
  --line:rgba(140,157,174,.28); --line2:rgba(140,157,174,.4); --accent:#5DB2F0; --accent-weak:#16324A; --focus:#5DB2F0;
  --neg:#F2867C; --neg-weak:#3A1D1C; --pos:#6FD39B; --pos-weak:#15342A; --neu:#9AAABB; --neu-weak:#22303F;
  --tag:#4A4012; --tag-ink:#FFE38A; --interp:#1A2836; --interp-line:#4C5D6E; --interp-ink:#B5C3D1;
  --reg:#B793F0; --geo:#F29A6A; --mkt:#5CCFD9; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.45;color:var(--ink);background:linear-gradient(160deg,var(--bg) 0%,var(--bg) 55%,var(--bg2) 100%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:56px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:18px;background:var(--surface2)}
.rail .logo{width:28px;height:28px;margin-bottom:22px;color:var(--ink);flex:none}
.rail a{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--ink2);text-decoration:none}
.rail a:hover,.rail a[aria-current="page"]{background:var(--accent-weak);color:var(--accent)}
.rail svg{width:20px;height:20px}
.rail .sp{flex:1}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:700}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1320px;margin:0 auto}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px 10px}
.proto{background:var(--tag);color:var(--tag-ink);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:3px}
.topbar h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.01em}
.topbar .grow{flex:1}
.updated{color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.tnum{font-variant-numeric:tabular-nums}
h2{font-size:17px;font-weight:900;margin:0;text-wrap:balance}
h3{font-size:14px;font-weight:900;margin:0}

/* ---------- Setup ---------- */
.setup{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;padding-top:8px}
.setup-intro{grid-column:1/-1;padding-block:10px 4px}
.setup-intro h2{font-size:30px;letter-spacing:-.02em;line-height:1.15}
.setup-intro p{margin:8px 0 0;color:var(--ink2);max-width:62ch;font-size:15px}
.steps{display:flex;flex-direction:column;gap:14px;min-width:0}
.step{padding:18px 20px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:900;font-size:13px}
.step h3{font-size:15px;align-self:center}
.step .body{grid-column:2;display:flex;flex-direction:column;gap:10px;min-width:0}
.step .hint{color:var(--ink2);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .ct{font-weight:400;opacity:.75;font-size:12px}
.drivers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dcard{border:1px solid var(--line2);border-radius:var(--r-sm);padding:12px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.dcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dcard b{display:flex;align-items:center;gap:8px}
.dcard span{color:var(--ink2);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-regulatory{background:var(--reg)}.d-geopolitical{background:var(--geo)}.d-market{background:var(--mkt)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface);text-align:left}
.check input{margin-top:2px;accent-color:var(--ink)}
.check small{display:block;color:var(--muted);font-size:12px}
.switch{display:flex;gap:10px;align-items:center;font-weight:700}
.switch input{width:16px;height:16px;accent-color:var(--ink)}
.preview{position:sticky;top:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.bigs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big{background:var(--surface2);border-radius:var(--r-sm);padding:10px}
.big b{display:block;font-size:24px;font-weight:900;line-height:1.1}
.big span{font-size:12px;color:var(--muted)}
.pv-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.pv-list li{font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.pv-list li span{display:block;color:var(--muted);font-size:12px}

/* ---------- Monitor ---------- */
.scope{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:12px;color:var(--ink2);font-size:12.5px}
.scope .pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.brief{padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;margin-bottom:14px}
.brief ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.brief li{padding-left:16px;position:relative;max-width:90ch}
.brief li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--interp-line)}
.ai-label{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--interp-ink);background:var(--interp);border:1px solid var(--interp-line);border-radius:999px;padding:2px 9px}
.cite{border:1px solid var(--line2);background:var(--surface2);border-radius:5px;font-size:11px;font-weight:700;padding:0 5px;margin-left:3px;color:var(--accent);vertical-align:1px}
.cite:hover{border-color:var(--accent)}
.brief-stats{border-left:1px solid var(--line);padding-left:18px;display:flex;flex-direction:column;gap:10px}
.stat b{font-size:22px;font-weight:900;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 11px;white-space:nowrap;font-size:12.5px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button+button{border-left:1px solid var(--line2)}
.tog{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700}
.tog[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
select.sel[data-on="true"]{border-color:var(--accent);background-color:var(--accent-weak);color:var(--accent)}
select.sel{appearance:none;-webkit-appearance:none;border:1px solid var(--line2);background-color:var(--surface);background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 19px) 55%,calc(100% - 14px) 55%;background-size:5px 5px;background-repeat:no-repeat;border-radius:999px;padding:5px 34px 5px 12px;font-size:12.5px;font-weight:700;max-width:220px}
.search{flex:1 1 180px;min-width:140px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.count-line{font-size:12.5px;color:var(--muted);margin-left:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:10px 14px;font-weight:700;color:var(--ink2);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs a span{font-weight:400;color:var(--muted);margin-left:4px}

.threads{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.tlist{display:flex;flex-direction:column;gap:8px}
.tcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tcard:hover{border-color:var(--line2)}
.tcard[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tcard .row{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.tcard h3{font-size:14px;line-height:1.3}
.tcard .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.strip{width:100%;height:26px;display:block}
.pattern{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap}
.p-hot{background:var(--neg-weak);color:var(--neg)}
.p-warm{background:var(--tag);color:var(--tag-ink)}
.p-cool{background:var(--neu-weak);color:var(--neu)}
.p-info{background:var(--accent-weak);color:var(--accent)}
.new{background:var(--accent);color:var(--surface);font-size:10px;font-weight:900;letter-spacing:.08em;border-radius:4px;padding:1px 5px;text-transform:uppercase}
.tdetail{padding:20px;min-width:0;display:flex;flex-direction:column;gap:16px}
.tdetail .lede{color:var(--ink2);margin:6px 0 0;max-width:75ch}
.tstats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tstats div{background:var(--surface2);border-radius:var(--r-sm);padding:8px 10px}
.tstats b{display:block;font-size:17px;font-weight:900}
.tstats span{font-size:11.5px;color:var(--muted)}
.patterns{display:flex;flex-direction:column;gap:6px}
.patterns li{display:flex;gap:10px;align-items:baseline;list-style:none}
.patterns ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chart{width:100%;height:auto;display:block}
.chart-wrap{overflow-x:auto}
.story{display:flex;flex-direction:column}
.story-head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:10px 4px;width:100%}
.ev:hover{background:var(--surface2)}
.ev-date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.ev-head{font-weight:700;display:block}
.ev-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:3px}
.ev-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.imp{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.imp.Negative{background:var(--neg-weak);color:var(--neg)}
.imp.Positive{background:var(--pos-weak);color:var(--pos)}
.imp.Neutral{background:var(--neu-weak);color:var(--neu)}
.mag{font-size:11.5px;color:var(--ink2);white-space:nowrap;display:inline-flex;gap:2px;align-items:center}
.mag i{width:5px;height:11px;border-radius:1px;background:var(--line2);display:inline-block}
.mag i.on{background:var(--ink)}
.tagline{display:inline-flex;align-items:center;gap:5px}
.mk{font-size:11px;font-weight:700;color:var(--geo);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.more{font-size:12px;color:var(--accent);font-weight:700;background:none;border:0;padding:0}
.dups{margin:6px 0 0;padding:0 0 0 12px;border-left:2px solid var(--line2);list-style:none;display:flex;flex-direction:column;gap:4px}
.dups button{background:none;border:0;padding:0;text-align:left;color:var(--ink2);font-size:12.5px}
.dups button:hover{color:var(--accent)}
.feed{padding:6px 16px 10px}
.month{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 4px 6px}
.empty{padding:28px;text-align:center;color:var(--muted)}

.cov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.cov .card{padding:18px 20px;min-width:0}
.cov .full{grid-column:1/-1}
.cov p{margin:6px 0 12px;color:var(--ink2);max-width:80ch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line2)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.cell{display:flex;align-items:center;justify-content:space-between;gap:6px;border-radius:6px;padding:6px 8px;min-height:34px}
.cell b{font-variant-numeric:tabular-nums}
.gap{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--neg)}
.kg-ok{color:var(--pos);font-weight:700;font-size:12px}
.kg-miss{color:var(--geo);font-weight:700;font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:70px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ink2)}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,23,46,.28);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;box-shadow:-8px 0 30px rgba(0,23,46,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-head h2{font-size:19px;line-height:1.25}
.dr-head .x{margin-left:auto;border:0;background:var(--surface2);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.dr-body{overflow-y:auto;padding:16px 22px 28px;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.facts{border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.interp{background:var(--interp);border:1px dashed var(--interp-line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.conf{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2)}
.conf .bar{width:60px}
.conf .bar i{background:var(--interp-ink)}
.src{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;flex-wrap:wrap}
.ents{width:100%;font-size:12.5px}
.ents td{padding:5px 6px}
.flagged{color:var(--neg);font-weight:700;font-size:12.5px}

/* requirements panel */
.reqp{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:21;box-shadow:-8px 0 30px rgba(0,23,46,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.req-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.req-list li{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.req-list small{color:var(--muted);grid-column:1}
.req-grp{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:14px 0 4px}
.req-grp.data{color:#5A4FCF}.req-grp.ux{color:#8A6D00}.req-grp.eng{color:var(--pos)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:30}

@media (max-width:1080px){
  .setup{grid-template-columns:minmax(0,1fr)}
  .preview{position:static}
  .threads{grid-template-columns:minmax(0,1fr)}
  .tstats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .brief{grid-template-columns:minmax(0,1fr)}

function patterns(list){
  const out=[]; if(!list.length) return out;
  const t30=new Date(Date.parse(TODAY)-30*864e5).toISOString().slice(0,10);
  const t60=new Date(Date.parse(TODAY)-60*864e5).toISOString().slice(0,10);
  const last=list.filter(e=>e.pub>=t30).length, prev=list.filter(e=>e.pub>=t60&&e.pub<t30).length;
  const subj = new Set(list.filter(e=>e.pub>=t60).flatMap(e=>e.ents.filter(x=>x.r==="Subject").map(x=>x.kg||x.n)));
  const neg = list.filter(e=>e.dir==="Negative").length/list.length;
  const cp = {}; list.forEach(e=>{ new Set(e.ents.filter(x=>x.t==="company"&&["Partner","Customer","Supplier","Target","Acquirer","Seller","Investor","Lender"].includes(x.r)&&x.kg).map(x=>x.n.replace(/ (Inc\.|Corp\.|Corporation|LLC)$/,""))).forEach(n=>cp[n]=(cp[n]||0)+1); });
  const top = Object.entries(cp).sort((a,b)=>b[1]-a[1])[0];
  const byEnt={}; list.forEach(e=>e.ents.filter(x=>x.kg&&x.t==="company").forEach(x=>{(byEnt[x.n]=byEnt[x.n]||new Set()).add(e.dir)}));
  const contested = Object.entries(byEnt).find(([n,s])=>s.has("Negative")&&s.has("Positive"));
  if(last>=3 && last>=2*Math.max(prev,1)) out.push({k:"Accelerating",c:"p-hot",t:`${last} reports in the last 30 days against ${prev} in the 30 before.`});
  else if(prev>=3 && last<=prev/2) out.push({k:"Cooling",c:"p-cool",t:`${last} reports in the last 30 days, down from ${prev}.`});
  if(subj.size>=4) out.push({k:"Spreading",c:"p-warm",t:`${subj.size} different organisations at the centre of events in the last 60 days.`});
  if(neg>=.5 && list.length>=3) out.push({k:"Mostly negative",c:"p-hot",t:`${pct(neg)} of reports are rated negative impact.`});
  if(contested) out.push({k:"Contested",c:"p-warm",t:`${contested[0]} appears in both negative and positive events, so the story is not settled.`});
  if(top && top[1]>=3 && top[1]/list.length>=.3) out.push({k:"Concentrated",c:"p-info",t:`${top[0]} is the counterparty in ${top[1]} of ${list.length} reports.`});
  if(!out.length) out.push({k:"Steady",c:"p-cool",t:`${last} reports in the last 30 days, ${prev} in the 30 before.`});
  return out;
}
function threadsData(){

}

  const st=S.setup; const count = id => E.filter(e=>e.themes.includes(id)).length;
  const prev = E.filter(e=>inSetup(e,st)); const th=new Set(prev.map(e=>e.thread).filter(Boolean));
  const leads=leadsOf(prev).map(g=>g.lead).sort((a,b)=>b.pub.localeCompare(a.pub)).slice(0,4);
  const topCo = DATA.kg.filter(k=>k.resolved && k.type==="company").slice(0,14);
  return `<section class="setup">
    <div class="setup-intro"><h2>Set up a disruption monitor</h2><p>Tell us which part of the energy market you cover and what you decide on. We match events to those decisions and group them into threads you can follow.</p></div>
    <div class="steps">
      <div class="card step"><span class="num">1</span><h3>Your energy segment</h3><div class="body">
        <p class="hint">Events are tagged to one or more themes. Pick the ones you cover.</p>
        <div class="chips">${DATA.themes.map(t=>`<button type="button" class="chip" data-setup-theme="${t.id}" aria-pressed="${st.themes.includes(t.id)}">${esc(t.label)} <span class="ct">${count(t.id)}</span></button>`).join("")}</div>
      </div></div>
      <div class="card step"><span class="num">2</span><h3>Drivers of disruption</h3><div class="body">
        <p class="hint">All three are on by default. Turn one off only if another team covers it.</p>
        <div class="drivers">${Object.keys(DRV).map(d=>`<button type="button" class="dcard" data-setup-driver="${d}" aria-pressed="${st.drivers.includes(d)}"><b>${drvDot(d)}${DRV[d]}</b><span>${DRV_DEF[d]}</span><span class="tnum">${E.filter(e=>e.drivers.includes(d)).length} events in sample</span></button>`).join("")}</div>
      </div></div>
      <div class="card step"><span class="num">3</span><h3>Decisions you make</h3><div class="body">
        <p class="hint">Each event type is mapped to the decision it informs. You see the ones that matter to you.</p>
        <div class="checks">${Object.keys(DEC).map(d=>`<label class="check"><input type="checkbox" id="dec-${d}" data-setup-dec="${d}" ${st.decisions.includes(d)?"checked":""}><span><b>${DEC[d]}</b><small>${DEC_HINT[d]} · ${E.filter(e=>e.decision===d).length} events</small></span></label>`).join("")}</div>
      </div></div>
      <div class="card step"><span class="num">4</span><h3>Companies to follow <span class="muted" style="font-weight:400">(optional)</span></h3><div class="body">
        <p class="hint">Leave empty to follow the whole segment. Names are matched through the Knowledge Graph, so “Constellation”, “Constellation Energy Corp.” and “Constellation Energy Corporation” count as one company.</p>
        <div class="chips">${topCo.map(k=>`<button type="button" class="chip" data-setup-watch="${esc(k.key)}" aria-pressed="${st.watch.includes(k.key)}">${esc(shortName(k.names))} <span class="ct">${k.n}</span></button>`).join("")}</div>
        <label class="switch"><input type="checkbox" id="mkt" data-setup-market ${st.market?"checked":""}> Always include market-level events with no company at the centre (strait closures, price shocks, sanctions on a country)</label>
      </div></div>
    </div>
    <aside class="card preview" aria-live="polite">
      <div class="eyebrow">Your monitor will show</div>
      <div class="bigs"><div class="big"><b class="tnum">${prev.length}</b><span>reports</span></div><div class="big"><b class="tnum">${leadsOf(prev).length}</b><span>developments</span></div><div class="big"><b class="tnum">${th.size}</b><span>threads</span></div></div>
      <div class="muted" style="font-size:12.5px">${prev.filter(isNew).length} new since your last visit on ${fmt(LAST_VISIT)} · ${prev.filter(e=>e.market).length} market-level</div>
      <ul class="pv-list">${leads.map(e=>`<li>${esc(e.head)}<span>${fmt(e.pub)} · ${DRV[e.driver]} · ${DEC[e.decision]}</span></li>`).join("")||'<li class="muted">Nothing matches yet. Add a theme or a decision.</li>'}</ul>
      <button class="btn primary" type="button" id="createBtn" ${prev.length?"":"disabled"} style="justify-content:center">Create monitor</button>
      <button class="btn ghost" type="button" id="resetSetup" style="justify-content:center">Reset to sample setup</button>
    </aside>
  </section>`;
}
function shortName(names){ return names.slice().sort((a,b)=>a.length-b.length)[0]; }

function vMonitor(tab){
  const sc=scoped(), vis=visible(), thr=threadsData();
  const st=S.setup;
  const scopeTxt = `<div class="scope"><span>Monitoring</span>
    ${st.themes.length===DATA.themes.length?'<span class="pill">All 8 energy themes</span>':st.themes.map(t=>`<span class="pill">${esc(THEME[t])}</span>`).join("")}
    <span class="pill">${st.drivers.map(d=>DRV[d]).join(" · ")}</span>
    <span class="pill">${st.decisions.length} of ${Object.keys(DEC).length} decisions</span>
    ${st.watch.length?`<span class="pill">${st.watch.length} companies followed</span>`:""}
    <a class="btn ghost sm" href="#setup">Edit setup</a></div>`;
  const tabs = `<nav class="tabs" aria-label="Views">
    <a href="#threads" ${tab==="threads"?'aria-current="page"':""}>Disruption threads<span>${thr.length}</span></a>
    <a href="#events" ${tab==="events"?'aria-current="page"':""}>All events<span>${vis.length}</span></a>
    <a href="#coverage" ${tab==="coverage"?'aria-current="page"':""}>Coverage &amp; sources</a></nav>`;
  let body = tab==="threads"? vThreads(thr) : tab==="events"? vEvents(vis) : vCoverage(sc);
  return scopeTxt + brief(sc, thr) + (tab!=="coverage"?filters(vis.length, sc.length):"") + tabs + body;
}

function brief(sc, thr){
  const fresh=sc.filter(isNew), fl=leadsOf(fresh);
  const cites=[]; const C = e => { cites.push(e.id); return `<button type="button" class="cite" data-ev="${esc(e.id)}" title="${esc(e.head)}">${cites.length}</button>`; };
  const lines=[];
  const hot = thr.filter(t=>t.fresh).sort((a,b)=>b.fresh-a.fresh).slice(0,3);
  lines.push(`<b>${fresh.length} new reports since ${fmt(LAST_VISIT)}</b>, which collapse to ${fl.length} distinct developments once repeat coverage is merged.`);
  hot.forEach(t=>{ const nw=t.list.filter(isNew); const e=nw[nw.length-1]; lines.push(`<b>${esc(t.label)}</b> (${t.pats[0].k.toLowerCase()}): ${esc(e.head)}.${C(e)}${nw.length>1?C(nw[0]):""}`); });
  const t30=new Date(Date.parse(TODAY)-45*864e5).toISOString().slice(0,10);
  const negs=sc.filter(e=>e.dir==="Negative"&&e.mag==="High"&&e.pub>=t30).sort((a,b)=>b.pub.localeCompare(a.pub));
  if(negs.length) lines.push(`Highest-risk signal in the last 45 days: ${esc(negs[0].head)}.${C(negs[0])} ${negs.length>1?`${negs.length-1} more high-impact negative events in the same window.`:""}`);
  const mk=sc.filter(e=>e.market).sort((a,b)=>b.pub.localeCompare(a.pub));
  if(mk.length) lines.push(`${mk.length} market-level events have no single company at the centre, most recently: ${esc(mk[0].head)}.${C(mk[0])}`);
  const lags=sc.filter(e=>e.tPrec==="Day"&&e.tStart).map(e=>days(e.tStart,e.pub)).filter(x=>x>=0).sort((a,b)=>a-b);
  const med=lags.length?lags[Math.floor(lags.length/2)]:0;
  return `<section class="card brief" aria-label="Briefing">
    <div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2>Since your last visit</h2><span class="ai-label">AI summary · interpretation</span></div>
    <ul>${lines.map(l=>`<li>${l}</li>`).join("")}</ul>
    <div class="muted" style="font-size:12px;margin-top:10px">Written from ${sc.length} classified events. Each numbered link opens the event and its source article. AI-generated content must be reviewed for accuracy.</div></div>
    <div class="brief-stats">
      <div class="stat"><b class="tnum">${fresh.length}</b><span>new reports since ${fmt(LAST_VISIT)}</span></div>
      <div class="stat"><b class="tnum">${thr.filter(t=>t.pats.some(p=>p.k==="Accelerating")).length}</b><span>threads accelerating</span></div>
      <div class="stat"><b class="tnum">${med} day${med===1?"":"s"}</b><span>median from event to alert, where the event date is known to the day</span></div>
    </div></section>`;
}

function filters(n, total){
  const f=S.f;
  const seg=(key,opts)=>`<div class="seg" role="group">${opts.map(([v,l,dot])=>`<button type="button" data-f="${key}" data-v="${v}" aria-pressed="${f[key]===v}">${dot?drvDot(v):""}${l}</button>`).join("")}</div>`;
  const tog=(key,l,title)=>`<button type="button" class="tog" data-ft="${key}" aria-pressed="${f[key]}" title="${esc(title)}">${l}</button>`;
  return `<div class="card filters" role="search">
    <select class="sel" id="fDrv" aria-label="Driver" data-on="${f.driver!=="all"}">${[["all","All drivers"],["regulatory","Regulatory"],["geopolitical","Geopolitical"],["market","Market & competitor"]].map(([v,l])=>`<option value="${v}" ${f.driver===v?"selected":""}>${l}</option>`).join("")}</select>
    <select class="sel" id="fDir" aria-label="Impact" data-on="${f.dir!=="all"}">${[["all","Any impact"],["Negative","Negative impact"],["Positive","Positive impact"],["Neutral","Neutral impact"]].map(([v,l])=>`<option value="${v}" ${f.dir===v?"selected":""}>${l}</option>`).join("")}</select>
    ${tog("high","High magnitude","Only events rated high magnitude")}
    ${tog("fresh","New since "+fmt(LAST_VISIT),"Published since your last visit")}
    ${tog("market","Market-level","Events with no company at the centre")}
    <select class="sel" id="fTheme" aria-label="Energy theme" data-on="${f.theme!=="all"}"><option value="all">All themes</option>${DATA.themes.filter(t=>S.setup.themes.includes(t.id)).map(t=>`<option value="${t.id}" ${f.theme===t.id?"selected":""}>${esc(t.label)}</option>`).join("")}</select>
    <select class="sel" id="fDec" aria-label="Decision" data-on="${f.decision!=="all"}"><option value="all">All decisions</option>${S.setup.decisions.map(d=>`<option value="${d}" ${f.decision===d?"selected":""}>${esc(DEC[d])}</option>`).join("")}</select>
    <input class="search" id="fQ" type="search" placeholder="Search events, companies, places" value="${esc(f.q)}" aria-label="Search">
    <span class="count-line tnum">${n} of ${total} events${(n<total)?` · <button class="btn ghost sm" type="button" id="clearF">Clear filters</button>`:""}</span>
  </div>`;
}

function vThreads(thr){
  if(!thr.length) return `<div class="card empty">No threads match these filters.</div>`;
  if(!S.thread || !thr.find(t=>t.id===S.thread)) S.thread=thr[0].id;
  const t=thr.find(x=>x.id===S.thread);
  const unthreaded = visible().filter(e=>!e.thread).length;
  const list = thr.map(x=>`<button type="button" class="tcard" data-thread="${x.id}" aria-current="${x.id===S.thread}">
      <div class="row"><h3>${esc(x.label)}</h3><span class="pattern ${x.pats[0].c}">${x.pats[0].k}</span></div>
      ${strip(x.list)}
      <div class="meta tnum"><span>${x.list.length} reports</span><span>${x.leads.length} developments</span>${x.fresh?`<span style="color:var(--accent);font-weight:700">${x.fresh} new</span>`:""}<span>Latest ${fmt(x.latest)}</span><span>${[...new Set(x.list.map(e=>e.driver))].map(drvDot).join(" ")}</span></div>
    </button>`).join("");
  const ents={}; t.list.forEach(e=>e.ents.filter(x=>["company","government","organization"].includes(x.t)).forEach(x=>{const k=x.kg||x.n; ents[k]=ents[k]||{n:x.n,c:0,kg:!!x.kg}; ents[k].c++; if(x.n.length<ents[k].n.length) ents[k].n=x.n;}));
  const topEnts=Object.values(ents).sort((a,b)=>b.c-a.c).slice(0,8);
  const leads=t.leads.slice().sort((a,b)=> S.storyOrder==="asc"? a.lead.pub.localeCompare(b.lead.pub) : b.lead.pub.localeCompare(a.lead.pub));
  const rows = S.merge? leads.map(groupRow).join("") : t.list.slice().sort((a,b)=>S.storyOrder==="asc"?a.pub.localeCompare(b.pub):b.pub.localeCompare(a.pub)).map(e=>evRow(e)).join("");
  return `<section class="threads">
    <div class="tlist">${list}<div class="muted" style="font-size:12.5px;padding:4px 6px">${unthreaded} events don't belong to a thread yet. Find them under <a href="#events">All events</a>.</div></div>
    <article class="card tdetail" aria-label="Thread">
      <div><div class="eyebrow">Disruption thread</div><h2 style="font-size:22px;margin-top:4px">${esc(t.label)}</h2>
        <p class="lede">${esc(t.blurb)} <span class="ai-label" style="vertical-align:1px">AI summary</span></p></div>
      <div class="tstats tnum">
        <div><b>${t.list.length}</b><span>reports</span></div><div><b>${t.leads.length}</b><span>developments</span></div>
        <div><b>${Object.keys(ents).length}</b><span>organisations</span></div><div><b>${t.fresh}</b><span>new since ${fmt(LAST_VISIT)}</span></div>
        <div><b>${fmt(t.list[0].pub)}</b><span>first seen</span></div><div><b>${fmt(t.latest)}</b><span>latest</span></div>
      </div>
      <div class="patterns"><div class="eyebrow">Detected patterns</div><ul>${t.pats.map(p=>`<li><span class="pattern ${p.c}">${p.k}</span><span>${esc(p.t)}</span></li>`).join("")}</ul></div>
      <div><div class="eyebrow" style="margin-bottom:6px">How the story built up</div>${storyChart(t)}</div>
      <div><div class="eyebrow" style="margin-bottom:6px">Who is involved</div><div class="chips">${topEnts.map(x=>`<span class="chip" style="cursor:default">${esc(x.n)} <span class="ct">${x.c}</span>${x.kg?"":'<span class="kg-miss" title="Not yet in the Knowledge Graph">·  not in KG</span>'}</span>`).join("")}</div></div>
      <div class="story">
        <div class="story-head"><div class="eyebrow">Timeline</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="tog" id="mergeTog" aria-pressed="${S.merge}" title="Group several reports of the same development into one row">Merge repeat reports</button>
            <div class="seg" role="group"><button type="button" data-order="asc" aria-pressed="${S.storyOrder==="asc"}">Oldest first</button><button type="button" data-order="desc" aria-pressed="${S.storyOrder==="desc"}">Newest first</button></div>
          </div></div>
        ${rows}
      </div>
    </article>
  </section>`;
}

function vEvents(vis){
  if(!vis.length) return `<div class="card empty">No events match these filters.</div>`;
  const groups = S.merge? leadsOf(vis).sort((a,b)=>b.lead.pub.localeCompare(a.lead.pub)) : vis.slice().sort((a,b)=>b.pub.localeCompare(a.pub)).map(e=>({lead:e,all:[e]}));
  let html="", cur="";
  for(const g of groups){ const m=g.lead.pub.slice(0,7); if(m!==cur){ cur=m; html+=`<div class="month">${MON[+m.slice(5)-1]} ${m.slice(0,4)}</div>`; } html+=groupRow(g); }
  return `<section class="card feed"><div class="story-head" style="padding-top:10px"><span class="muted tnum">${S.merge?`${groups.length} developments from ${vis.length} reports`:`${vis.length} reports`}</span>
    <button type="button" class="tog" id="mergeTog" aria-pressed="${S.merge}">Merge repeat reports</button></div>${html}</section>`;
}

function vCoverage(sc){
  const th=DATA.themes.filter(t=>S.setup.themes.includes(t.id)), dr=S.setup.drivers;
  const cnt=(t,d)=>sc.filter(e=>e.themes.includes(t)&&e.drivers.includes(d)).length;
  const max=Math.max(1,...th.flatMap(t=>dr.map(d=>cnt(t.id,d))));
  const matrix=`<div class="tbl"><table><thead><tr><th>Energy theme</th>${dr.map(d=>`<th>${drvDot(d)} ${DRV[d]}</th>`).join("")}</tr></thead><tbody>${th.map(t=>`<tr><td><b>${esc(t.label)}</b></td>${dr.map(d=>{const n=cnt(t.id,d); const k=t.id+"|"+d; const a=.08+.6*n/max; return `<td><div class="cell" style="background:color-mix(in srgb, var(--accent) ${Math.round(a*100)}%, transparent)"><b>${n}</b>${n<=1?(S.gapReq.has(k)?'<span class="muted" style="font-size:11.5px">Sources requested</span>':`<button class="btn sm" type="button" data-gap="${k}"><span class="gap">Gap</span> Request sources</button>`):""}</div></td>`;}).join("")}</tr>`).join("")}</tbody></table></div>`;
  const unres=DATA.kg.filter(k=>!k.resolved && k.type!=="government" && k.events.some(id=>sc.find(e=>e.id===id)));
  const merged=DATA.kg.filter(k=>k.resolved && k.names.length>1);
  const kgRows=unres.slice(0,14).map(k=>`<tr><td>${esc(k.names[0])}<div class="muted" style="font-size:12px">${esc(k.type)}</div></td><td class="n">${k.n}</td><td style="text-align:right">${S.kgQueued.has(k.key)?'<span class="kg-ok">Queued for review</span>':`<button class="btn sm" type="button" data-kg="${esc(k.key)}">Add to Knowledge Graph</button>`}</td></tr>`).join("");
  const src={}; sc.forEach(e=>{ const s=srcId(e.art); src[s]=src[s]||{n:0,corr:0,conf:0,last:""}; const o=src[s]; o.n++; if(e.rel.length||e.dupN>1) o.corr++; o.conf+=e.dirC; if(e.pub>o.last) o.last=e.pub; });
  const srcRows=Object.entries(src).sort((a,b)=>b[1].n-a[1].n).slice(0,12).map(([s,o])=>`<tr><td class="mono">${esc(s)}</td><td class="n">${o.n}</td><td class="n">${pct(o.corr/o.n)}</td><td><span class="bar"><i style="width:${o.conf/o.n*100}%"></i></span> <span class="tnum">${(o.conf/o.n).toFixed(2)}</span></td><td class="n">${fmt(o.last)}</td></tr>`).join("");
  const lags=sc.filter(e=>e.tPrec==="Day"&&e.tStart).map(e=>days(e.tStart,e.pub)).filter(x=>x>=0);
  const within2=lags.filter(x=>x<=2).length;
  const types={}; sc.forEach(e=>{types[e.type]=types[e.type]||{cat:e.cat,decs:{},n:0,dc:0}; const o=types[e.type]; o.n++; o.dc+=e.dirC; o.decs[e.decision]=(o.decs[e.decision]||0)+1;});
  const typeRows=Object.entries(types).sort((a,b)=>b[1].n-a[1].n).map(([t,o])=>`<tr><td><b>${esc(t)}</b><div class="muted" style="font-size:12px">${esc(o.cat)}</div></td><td>${Object.entries(o.decs).sort((a,b)=>b[1]-a[1]).map(([k])=>esc(DEC[k])).join(", ")}</td><td class="n">${o.n}</td><td class="n">${(o.dc/o.n).toFixed(2)}</td></tr>`).join("");
  return `<section class="cov">
    <div class="card full"><h2>Coverage by theme and driver</h2><p>Events in your monitor, counted by energy theme and driver. An event can count in more than one cell. Cells with one event or none are gaps. Request sources to have the content team find publications that cover them.</p>${matrix}</div>
    <div class="card"><h2>Knowledge Graph gaps</h2><p>${unres.length} organisations named in your events are not yet in the Knowledge Graph, so they can't be followed or linked across stories. Governments and places are left out of this list. The Knowledge Graph already merges ${merged.length} sets of name variants, such as ${esc(merged.slice(0,2).map(k=>k.names.join(" / ")).join("; "))}.</p>
      <div class="tbl"><table><thead><tr><th>Organisation</th><th class="n">Events</th><th></th></tr></thead><tbody>${kgRows}</tbody></table></div>${unres.length>14?`<div class="muted" style="font-size:12px;margin-top:8px">and ${unres.length-14} more</div>`:""}</div>
    <div class="card"><h2>Sources</h2><p>Every event cites the article it was extracted from. Corroborated means at least one other article reports the same development. Publication names aren't in the sample file; the first part of each article ID identifies the publication.</p>
      <div class="tbl"><table><thead><tr><th>Publication</th><th class="n">Events</th><th class="n">Corroborated</th><th>Avg confidence</th><th class="n">Latest</th></tr></thead><tbody>${srcRows}</tbody></table></div>
      <div class="muted" style="font-size:12.5px;margin-top:10px">Timeliness: ${lags.length?`${pct(within2/lags.length)} of events with a known day surfaced within 2 days of happening.`:"no day-precise events in scope."}</div></div>
    <div class="card full"><h2>Classification reference</h2><p>Every event uses the same taxonomy, the same impact scale (negative, neutral, positive) and the same magnitude scale (low, medium, high), each with a model confidence score. That consistency is what makes trends comparable across threads.</p>
      <div class="tbl"><table><thead><tr><th>Event type</th><th>Informs decision</th><th class="n">Events</th><th class="n">Avg confidence</th></tr></thead><tbody>${typeRows}</tbody></table></div></div>
  </section>`;
}

function vDrawer(e){
  const lag = e.tPrec==="Day"&&e.tStart? days(e.tStart,e.pub) : null;
  const when = e.tStart===e.tEnd? fmtY(e.tStart) : `${fmtY(e.tStart)} to ${fmtY(e.tEnd)}`;
  const ents = e.ents.slice().sort((a,b)=>(a.r==="Subject"?-1:0)-(b.r==="Subject"?-1:0));
  const sib = E.filter(x=>x.dup===e.dup && x.id!==e.id);
  const t = e.thread? THREAD[e.thread] : null;
  const flagged = S.flags.has(e.id);
  const confBar = c => `<span class="conf"><span class="bar"><i style="width:${c*100}%"></i></span>${c.toFixed(2)}</span>`;
  return `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle">
    <div class="dr-head"><div><div class="eyebrow">${fmtY(e.pub)} · ${esc(e.status)} ${isNew(e)?'<span class="new">New</span>':""}</div><h2 id="drTitle" style="margin-top:4px">${esc(e.head)}</h2></div><button class="x" type="button" data-close aria-label="Close">×</button></div>
    <div class="dr-body">
      <section class="sec"><div class="sec-h"><h3>Reported facts</h3><span class="muted" style="font-size:12px">Extracted from the source article, without interpretation</span></div>
        <div class="facts">
          <p style="margin:0">${esc(e.desc)}</p>
          <dl class="kv">
            <dt>When it happened</dt><dd>${when} <span class="muted">· date precision: ${esc(e.tPrec||"unknown")}${e.tRaw?` · source wording “${esc(e.tRaw)}”`:""}</span></dd>
            <dt>Published</dt><dd>${fmtY(e.pub)}${lag!==null?` <span class="muted">· surfaced ${lag===0?"the same day":lag+" day"+(lag===1?"":"s")+" after it happened"}</span>`:""}</dd>
            <dt>Status as reported</dt><dd>${esc(e.status)}</dd>
            <dt>At the centre</dt><dd>${e.market?'<span class="mk">Market-level</span> no single company at the centre':esc(ents.filter(x=>x.r==="Subject").map(x=>x.n).join(", "))}</dd>
          </dl>
          <div class="tbl"><table class="ents"><thead><tr><th>Named in source</th><th>Role</th><th>Type</th><th>Knowledge Graph</th></tr></thead><tbody>${ents.map(x=>`<tr><td><b>${esc(x.n)}</b>${x.x?`<div class="muted" style="font-size:11.5px">${esc(x.x)}</div>`:""}</td><td>${esc(x.r)}</td><td>${esc(x.t)}</td><td>${x.kg?'<span class="kg-ok">Linked</span>':(["company","organization","government"].includes(x.t)?(S.kgQueued.has("unresolved:"+x.n)?'<span class="kg-ok">Queued</span>':`<button class="btn sm" type="button" data-kg="${esc("unresolved:"+x.n)}">Add</button>`):'<span class="muted">n/a</span>')}</td></tr>`).join("")}</tbody></table></div>
        </div>
      </section>
      <section class="sec"><div class="sec-h"><h3>Sources</h3><span class="muted" style="font-size:12px">${1+e.rel.length+sib.length} article${e.rel.length+sib.length?"s":""} behind this signal</span></div>
        <div class="src">
          <div class="srow"><span><b>Primary article</b> <span class="muted">· publication ${esc(srcId(e.art))}</span></span><span class="mono">${esc(docId(e.art))}</span></div>
          ${e.rel.map(r=>`<div class="srow"><span>Corroborating article <span class="muted">· publication ${esc(srcId(r))}</span></span><span class="mono">${esc(docId(r))}</span></div>`).join("")}
          ${sib.map(x=>`<div class="srow"><span>Repeat report: <button class="more" type="button" data-ev="${esc(x.id)}">${esc(x.head)}</button></span><span class="muted">${fmt(x.pub)} · publication ${esc(srcId(x.art))}</span></div>`).join("")}
          <div class="muted mono" style="font-size:11.5px">Event ID ${esc(e.id)}</div>
        </div>
      </section>
      <section class="sec"><div class="sec-h"><h3>Interpretation</h3><span class="ai-label">Model output · not in the source</span></div>
        <div class="interp">
          <dl class="kv">
            <dt>Classified as</dt><dd>${esc(e.cat)} › <b>${esc(e.type)}</b></dd>
            <dt>Impact on subject</dt><dd>${imp(e.dir)} ${confBar(e.dirC)}</dd>
            <dt>Magnitude</dt><dd>${mag(e.mag)} ${confBar(e.magC)}</dd>
            <dt>Driver</dt><dd>${e.drivers.map(d=>`<span class="tagline">${drvDot(d)}${DRV[d]}${d===e.driver&&e.drivers.length>1?" (primary)":""}</span>`).join(" &nbsp; ")}<div class="muted" style="font-size:12px;margin-top:3px">Why: ${esc(e.why.join("; "))}.</div></dd>
            <dt>Energy themes</dt><dd>${e.themes.map(t=>esc(THEME[t])).join(", ")}</dd>
            <dt>Informs decision</dt><dd><b>${esc(DEC[e.decision])}</b><div class="muted" style="font-size:12px">${esc(DEC_HINT[e.decision])}</div></dd>
            <dt>Disruption thread</dt><dd>${t?`<a href="#threads" data-goto-thread="${e.thread}">${esc(t.label)}</a>`:'<span class="muted">Not part of a thread yet</span>'}</dd>
          </dl>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${flagged?'<span class="flagged">Flagged for analyst review</span> <button class="btn sm" type="button" data-flag="'+esc(e.id)+'">Undo</button>':`<button class="btn sm" type="button" data-flag="${esc(e.id)}">Flag a classification problem</button>`}<span class="muted" style="font-size:12px">Flags go to the analyst team and feed classifier tuning.</span></div>
        </div>
      </section>
    </div></aside>`;
}

const REQS = [
 ["data","Identify necessary sources and publications","coverage"],
 ["data","Every signal links back to its source events and articles","event"],
 ["data","Relevant data sources and publications","coverage"],
 ["data","Pull relevant content as part of event extraction","event"],
 ["data","Use established, authoritative sources","coverage"],
 ["data","Capture events with no company at the centre","market"],
 ["data","Event / decision matching","setup"],
 ["data","Capture events relevant to the defined energy segment","setup"],
 ["data","Cover three drivers: regulatory, geopolitical, market and competitor","setup"],
 ["data","Trust and transparency in citation, classification and event definition","event"],
 ["data","Timeliness of surfacing new developments","brief"],
 ["data","Consistent classification and rating for trend detection","coverage"],
 ["ux","Simple setup and workflows","setup"],
 ["eng","Fill gaps in Knowledge Graph coverage","coverage"],
 ["eng","Keep facts separate from interpretation","event"],
 ["eng","Group events into disruption threads that show a story over time (+ filter)","threads"],
 ["eng","Map events to energy themes and industry","threads"],
 ["eng","Detect disruption patterns from events","threads"],
 ["eng","Use AI to help users deal with volume and complexity","brief"],
];
const REQ_WHERE = {coverage:"Coverage & sources tab", event:"Event detail panel", market:"Market-level filter and badge", setup:"Setup, steps 1–3", brief:"“Since your last visit” brief", threads:"Disruption threads tab"};
function vReq(){
  const grp={data:"Data",ux:"UX",eng:"Engineering"}; let last="";
  return `<div class="scrim" data-close></div><aside class="reqp" role="dialog" aria-modal="true" aria-labelledby="rqT"><div class="dr-head"><div><div class="eyebrow">Must-have board</div><h2 id="rqT" style="margin-top:4px">Where each requirement lives</h2></div><button class="x" type="button" data-close aria-label="Close">×</button></div>
  <div class="dr-body" style="gap:0"><ul class="req-list">${REQS.map(([g,t,w])=>{ const h=g!==last?`<li class="req-grp ${g}" style="display:block;border:0">${grp[g]}</li>`:""; last=g; return h+`<li><span>${esc(t)}</span><button class="btn sm" type="button" data-req="${w}">Show</button><small>${REQ_WHERE[w]}</small></li>`; }).join("")}</ul></div></aside>`;
}

/* ---------- render + events ---------- */
const $view=document.getElementById("view"), $layer=document.getElementById("layer");
function route(){ const h=(location.hash||"#setup").slice(1); return ["setup","threads","events","coverage"].includes(h)?h:"setup"; }
function render(){
  const r=route(); const y=window.scrollY;
  const focusId=document.activeElement&&document.activeElement.id; const selStart=document.activeElement&&document.activeElement.selectionStart;
  $view.innerHTML = r==="setup"? vSetup() : vMonitor(r);
  document.querySelectorAll(".rail a").forEach(a=>{ if(a.dataset.nav===r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  document.getElementById("updated").textContent = `Updated ${fmtY(TODAY)} · last visit ${fmt(LAST_VISIT)}`;
  if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); if(selStart!=null&&el.setSelectionRange) try{el.setSelectionRange(selStart,selStart);}catch(_){} } }
  window.scrollTo(0,y);
}
function renderLayer(){
  if(S.open==="__req") $layer.innerHTML=vReq();
  else if(S.open && byId[S.open]) $layer.innerHTML=vDrawer(byId[S.open]);
  else $layer.innerHTML="";
  const x=$layer.querySelector(".x"); if(x) x.focus();
}
let toastT; function toast(msg){ clearTimeout(toastT); let t=document.querySelector(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t);} t.textContent=msg; toastT=setTimeout(()=>t.remove(),2200); }
function saveSetup(){ store.set("setup",S.setup); }
function toggleIn(arr,v){ const i=arr.indexOf(v); i>=0?arr.splice(i,1):arr.push(v); }

document.addEventListener("click", ev=>{
  const el=ev.target.closest("[data-ev],[data-thread],[data-f],[data-ft],[data-order],[data-expand],[data-setup-theme],[data-setup-driver],[data-setup-watch],[data-kg],[data-gap],[data-flag],[data-close],[data-req],[data-goto-thread],#createBtn,#resetSetup,#mergeTog,#clearF,#reqBtn");
  if(!el) return;
  const d=el.dataset;
  if(d.ev){ S.open=d.ev; renderLayer(); return; }
  if(d.close!==undefined){ S.open=null; renderLayer(); return; }
  if(d.gotoThread){ S.thread=d.gotoThread; S.open=null; renderLayer(); if(route()!=="threads"){ location.hash="threads"; } else render(); window.scrollTo(0,0); ev.preventDefault(); return; }
  if(d.thread){ S.thread=d.thread; render(); if(window.innerWidth<1080){ const a=document.querySelector(".tdetail"); a&&a.scrollIntoView({block:"start"}); } return; }
  if(d.f){ S.f[d.f]=d.v; render(); return; }
  if(d.ft){ S.f[d.ft]=!S.f[d.ft]; render(); return; }
  if(d.order){ S.storyOrder=d.order; render(); return; }
  if(d.expand){ S.expanded.has(d.expand)?S.expanded.delete(d.expand):S.expanded.add(d.expand); render(); return; }
  if(el.id==="mergeTog"){ S.merge=!S.merge; render(); return; }
  if(el.id==="clearF"){ S.f={driver:"all",dir:"all",high:false,market:false,fresh:false,theme:"all",decision:"all",q:""}; render(); return; }
  if(d.setupTheme){ toggleIn(S.setup.themes,d.setupTheme); saveSetup(); render(); return; }
  if(d.setupDriver){ toggleIn(S.setup.drivers,d.setupDriver); saveSetup(); render(); return; }
  if(d.setupWatch){ toggleIn(S.setup.watch,d.setupWatch); saveSetup(); render(); return; }
  if(el.id==="createBtn"){ saveSetup(); location.hash="threads"; window.scrollTo(0,0); toast("Monitor created"); return; }
  if(el.id==="resetSetup"){ S.setup={themes:DATA.themes.map(t=>t.id),drivers:["regulatory","geopolitical","market"],decisions:Object.keys(DEC),watch:[],market:true}; saveSetup(); render(); return; }
  if(d.kg){ S.kgQueued.add(d.kg); store.set("kgq",[...S.kgQueued]); render(); renderLayer(); toast("Sent to the Knowledge Graph team for review"); return; }
  if(d.gap){ S.gapReq.add(d.gap); store.set("gapreq",[...S.gapReq]); render(); toast("Source request logged"); return; }
  if(d.flag){ S.flags.has(d.flag)?S.flags.delete(d.flag):S.flags.add(d.flag); store.set("flags",[...S.flags]); renderLayer(); toast(S.flags.has(d.flag)?"Flagged for analyst review":"Flag removed"); return; }
  if(el.id==="reqBtn"){ S.open="__req"; renderLayer(); return; }
  if(d.req){
    S.open=null; renderLayer(); const w=d.req;
    if(w==="setup") location.hash="setup";
    else if(w==="coverage") location.hash="coverage";
    else if(w==="market"){ S.f.market=true; location.hash="events"; render(); }
    else if(w==="event"){ location.hash="threads"; render(); const first=document.querySelector(".tdetail [data-ev]"); if(first){ S.open=first.dataset.ev; renderLayer(); } }
    else location.hash="threads";
    window.scrollTo(0,0); return;
  }
});
document.addEventListener("change", ev=>{
  const t=ev.target;
  if(t.dataset.setupDec){ toggleIn(S.setup.decisions,t.dataset.setupDec); saveSetup(); render(); }
  else if(t.dataset.setupMarket!==undefined){ S.setup.market=t.checked; saveSetup(); render(); }
  else if(t.id==="fDrv"){ S.f.driver=t.value; render(); }
  else if(t.id==="fDir"){ S.f.dir=t.value; render(); }
  else if(t.id==="fTheme"){ S.f.theme=t.value; render(); }
  else if(t.id==="fDec"){ S.f.decision=t.value; render(); }
});
let qT; document.addEventListener("input", ev=>{ if(ev.target.id==="fQ"){ clearTimeout(qT); const v=ev.target.value; qT=setTimeout(()=>{ S.f.q=v; render(); },180); } });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && S.open){ S.open=null; renderLayer(); } });
window.addEventListener("hashchange", ()=>{ render(); });
render();
})();
</script>
